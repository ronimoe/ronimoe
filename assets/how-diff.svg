<text x="1256" y="30" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#8b949e">the usual way → my way</text>
<rect x="1" y="64" width="1278" height="32" fill="#2d1417"/><rect x="1" y="64" width="112" height="32" fill="#3c1618"/><text x="44" y="85" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681">1</text><text x="96" y="85" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681"></text><text x="128" y="85" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#ffa198">−</text><rect x="148" y="69" width="437.4" height="22" rx="3" fill="#da3633" fill-opacity=".28"/><text x="150" y="85" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#ffa198" text-decoration="line-through">tweak the prompt, eyeball a few outputs, ship</text><rect x="1" y="96" width="1278" height="32" fill="#12261e"/><rect x="1" y="96" width="112" height="32" fill="#1b3a26"/><text x="44" y="117" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681"></text><text x="96" y="117" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681">1</text><text x="128" y="117" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#aff5b4">+</text><rect x="148.0" y="101" width="215.9" height="22" rx="3" fill="#2ea043" fill-opacity=".45"/><text x="150" y="117" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#aff5b4">every prompt is hashed. Change one without re-running its eval and the build goes red</text><rect x="1" y="140" width="1278" height="32" fill="#2d1417"/><rect x="1" y="140" width="112" height="32" fill="#3c1618"/><text x="44" y="161" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681">2</text><text x="96" y="161" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681"></text><text x="128" y="161" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#ffa198">−</text><rect x="148" y="145" width="167.7" height="22" rx="3" fill="#da3633" fill-opacity=".28"/><text x="150" y="161" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#ffa198" text-decoration="line-through">&quot;the eval passed&quot;</text><rect x="1" y="172" width="1278" height="32" fill="#12261e"/><rect x="1" y="172" width="112" height="32" fill="#1b3a26"/><text x="44" y="193" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681"></text><text x="96" y="193" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681">2</text><text x="128" y="193" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#aff5b4">+</text><rect x="302.1" y="177" width="293.0" height="22" rx="3" fill="#2ea043" fill-opacity=".45"/><text x="150" y="193" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#aff5b4">caught an agent scoring 100% by saying nothing at all. Now every check demands real output first</text><rect x="1" y="216" width="1278" height="32" fill="#2d1417"/><rect x="1" y="216" width="112" height="32" fill="#3c1618"/><text x="44" y="237" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681">3</text><text x="96" y="237" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681"></text><text x="128" y="237" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#ffa198">−</text><rect x="148" y="221" width="418.2" height="22" rx="3" fill="#da3633" fill-opacity=".28"/><text x="150" y="237" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#ffa198" text-decoration="line-through">ask the model nicely not to touch the price</text><rect x="1" y="248" width="1278" height="32" fill="#12261e"/><rect x="1" y="248" width="112" height="32" fill="#1b3a26"/><text x="44" y="269" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681"></text><text x="96" y="269" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681">3</text><text x="128" y="269" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#aff5b4">+</text><rect x="273.2" y="253" width="138.8" height="22" rx="3" fill="#2ea043" fill-opacity=".45"/><text x="150" y="269" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#aff5b4">the price is pinned in code. When the prompt already says it, the next fix is a guard, not a sentence</text><rect x="1" y="292" width="1278" height="32" fill="#2d1417"/><rect x="1" y="292" width="112" height="32" fill="#3c1618"/><text x="44" y="313" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681">4</text><text x="96" y="313" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681"></text><text x="128" y="313" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#ffa198">−</text><rect x="148" y="297" width="321.9" height="22" rx="3" fill="#da3633" fill-opacity=".28"/><text x="150" y="313" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#ffa198" text-decoration="line-through">the smartest model for everything</text><rect x="1" y="324" width="1278" height="32" fill="#12261e"/><rect x="1" y="324" width="112" height="32" fill="#1b3a26"/><text x="44" y="345" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681"></text><text x="96" y="345" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681">4</text><text x="128" y="345" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#aff5b4">+</text><rect x="167.3" y="329" width="235.2" height="22" rx="3" fill="#2ea043" fill-opacity=".45"/><text x="150" y="345" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#aff5b4">a mid model on high effort writes the code. The top model only makes the calls a spec can&#x27;t</text><rect x="1" y="368" width="1278" height="32" fill="#2d1417"/><rect x="1" y="368" width="112" height="32" fill="#3c1618"/><text x="44" y="389" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681">5</text><text x="96" y="389" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681"></text><text x="128" y="389" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#ffa198">−</text><rect x="148" y="373" width="370.0" height="22" rx="3" fill="#da3633" fill-opacity=".28"/><text x="150" y="389" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#ffa198" text-decoration="line-through">let the AI run on its own from day one</text><rect x="1" y="400" width="1278" height="32" fill="#12261e"/><rect x="1" y="400" width="112" height="32" fill="#1b3a26"/><text x="44" y="421" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681"></text><text x="96" y="421" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681">5</text><text x="128" y="421" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#aff5b4">+</text><rect x="408.1" y="405" width="196.6" height="22" rx="3" fill="#2ea043" fill-opacity=".45"/><text x="150" y="421" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#aff5b4">every human approve/reject becomes labeled data. Autonomy is earned one eval score at a time</text><rect x="1" y="444" width="1278" height="32" fill="#2d1417"/><rect x="1" y="444" width="112" height="32" fill="#3c1618"/><text x="44" y="465" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681">6</text><text x="96" y="465" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681"></text><text x="128" y="465" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#ffa198">−</text><rect x="148" y="449" width="360.4" height="22" rx="3" fill="#da3633" fill-opacity=".28"/><text x="150" y="465" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#ffa198" text-decoration="line-through">output breaks, blame the architecture</text><rect x="1" y="476" width="1278" height="32" fill="#12261e"/><rect x="1" y="476" width="112" height="32" fill="#1b3a26"/><text x="44" y="497" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681"></text><text x="96" y="497" text-anchor="end" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13" fill="#6e7681">6</text><text x="128" y="497" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" font-weight="700" fill="#aff5b4">+</text><rect x="735.6" y="481" width="196.6" height="22" rx="3" fill="#2ea043" fill-opacity=".45"/><text x="150" y="497" font-family="'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="16" fill="#aff5b4">swap the model first. One replied in Chinese on 6% of calls: measured, then fired</text>
